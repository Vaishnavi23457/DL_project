name: Run notebooks and commit results

on:
  workflow_dispatch:

jobs:
  run-notebooks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install notebook dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install papermill nbformat nbconvert
          pip install pandas numpy scipy librosa opencv-python-headless scikit-learn matplotlib
          # If the notebooks rely on other libs, add them here as needed:
          # pip install torch torchvision

      - name: Prepare output folders
        run: |
          mkdir -p modality_bias/results
          mkdir -p modality_bias/notebooks/executed

      - name: Run notebook 1
        run: |
          papermill \
            "modality_bias/notebooks/02.A_XAI_CORRELATION_CREMA_D_CMU (1).ipynb" \
            "modality_bias/notebooks/executed/02.A_XAI_CORRELATION_CREMA_D_CMU.executed.ipynb"

      - name: Run notebook 2
        run: |
          papermill \
            "modality_bias/notebooks/02.B_BIAS_ANALYSIS_CREMA_D_CMU_COLAB_READY (1).ipynb" \
            "modality_bias/notebooks/executed/02.B_BIAS_ANALYSIS_CREMA_D_CMU_COLAB_READY.executed.ipynb"

      - name: Copy generated artifacts into modality_bias/results
        run: |
          mkdir -p modality_bias/results
          find . -type f \
            \( -iname "*.csv" -o -iname "*.pkl" -o -iname "*.pickle" -o -iname "*.npy" -o -iname "*.npz" \
               -o -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.json" -o -iname "*.txt" \
               -o -iname "*.parquet" \) \
            -not -path "./.git/*" \
            -not -path "./modality_bias/results/*" \
            -print0 | while IFS= read -r -d '' f; do
              rel="${f#./}"
              target="modality_bias/results/${rel}"
              mkdir -p "$(dirname "$target")"
              cp "$f" "$target"
            done

      - name: Commit results back to the repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modality_bias/results || true
          git add modality_bias/notebooks/executed || true
          git commit -m "Add notebook execution outputs to modality_bias/results" || echo "No changes to commit"
          git push

      - name: Upload executed notebooks as artifact
        uses: actions/upload-artifact@v4
        with:
          name: executed-notebooks
          path: modality_bias/notebooks/executed/
